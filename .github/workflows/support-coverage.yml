name: Support Coverage validation
on:
  push:
    branches: [support-coverage]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua validators
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4 zip unzip
      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          find AlphaSquadUI -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          find AlphaSquadUI -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.4 -p
      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('AlphaSquadUI')
          text=(root/'AlphaSquadUI.txt').read_text()
          paths=[line.strip() for line in text.splitlines() if line.strip() and not line.startswith('##')]
          assert len(paths)==len(set(paths)), 'Duplicate manifest path'
          assert all((root/path).is_file() for path in paths), 'Missing manifest file'
          version=re.search(r'^## Version: (.+)$',text,re.M).group(1)
          assert f'ASUI.version = "{version}"' in (root/'Core/Core.lua').read_text()
          assert re.search(r'^## AddOnVersion: [0-9]+$',text,re.M)
          print('Manifest and version checks passed')
          PY
      - name: Run deterministic regression tests
        run: |
          set -euo pipefail
          for test in tests/*.lua; do
            lua5.1 "$test"
            lua5.4 "$test"
          done
      - name: Build and validate optional companion
        run: |
          set -euo pipefail
          python3 tooling/build_companion.py AlphaSquadBuildShare.zip
          mkdir -p build/companion
          unzip -q AlphaSquadBuildShare.zip -d build/companion
          find build/companion -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          find build/companion -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.4 -p
          lua5.1 tests/companion_package.lua build/companion/AlphaSquadBuildShare
          lua5.4 tests/companion_package.lua build/companion/AlphaSquadBuildShare
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaSquadBuildShare
          path: AlphaSquadBuildShare.zip
          if-no-files-found: error
      - name: Package source for independent review
        if: always()
        run: zip -r SupportCoverage-review-source.zip AlphaSquadUI companion tooling docs .github tests -x '*/.gitkeep' || test -f SupportCoverage-review-source.zip
      - name: Package installable addon
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: //p' AlphaSquadUI/AlphaSquadUI.txt)"
          archive="AlphaSquadUI-${version}.zip"
          zip -r "$archive" AlphaSquadUI -x '*/.gitkeep'
          unzip -t "$archive"
          test "$(zipinfo -1 "$archive" | head -n 1)" = "AlphaSquadUI/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SupportCoverage-review-source
          path: SupportCoverage-review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaSquadUI-support-coverage
          path: AlphaSquadUI-*.zip
          if-no-files-found: error
