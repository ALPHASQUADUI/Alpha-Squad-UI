name: Validate AlphaSquadUI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proposed source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install supported Lua runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 lua5.4

      - name: Check privacy, security, regressions and exact installable packages
        run: python3 tooling/validate.py --output-dir dist

      - name: Upload the exact validated archives and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AlphaSquadUI-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish-release:
    needs: validate-and-package
    if: github.event_name == 'push' && github.repository == 'ALPHASQUADUI/Alpha-Squad-UI' && github.ref == 'refs/heads/support-coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-alpha-squad-ui
      cancel-in-progress: false
    steps:
      - name: Checkout authorized publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AlphaSquadUI-release-${{ github.sha }}
          path: dist

      - name: Verify hashes and publish authorized version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/publish_release.py dist
