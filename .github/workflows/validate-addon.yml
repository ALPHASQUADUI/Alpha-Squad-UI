name: Validate AlphaSquadUI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua and ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4 zip unzip

      - name: Validate runtimes, regressions, manifests and packages
        run: python3 tooling/validate.py

      - name: Build addon ZIP
        run: |
          set -euo pipefail
          zip -r AlphaSquadUI.zip AlphaSquadUI -x '*/.gitkeep'
          unzip -t AlphaSquadUI.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('AlphaSquadUI.zip'); assert all(p.startswith('AlphaSquadUI/') for p in z.namelist())"

      - name: Build companion ZIP
        run: python3 tooling/build_companion.py AlphaSquadBuildShare.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaSquadBuildShare
          path: AlphaSquadBuildShare.zip
          if-no-files-found: error
      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSquadUI
          path: AlphaSquadUI.zip
          if-no-files-found: error
