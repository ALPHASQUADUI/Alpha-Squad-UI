name: Validate AlphaSquadUI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua and ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4 zip unzip

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          find AlphaSquadUI -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.1 -p
          find AlphaSquadUI -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 luac5.4 -p

      - name: Run deterministic regression tests
        run: |
          set -euo pipefail
          lua5.1 tests/support_coverage.lua
          lua5.4 tests/support_coverage.lua
          lua5.1 tests/ult_tracker.lua
          lua5.4 tests/ult_tracker.lua
          lua5.1 tests/overload.lua
          lua5.4 tests/overload.lua

      - name: Validate addon manifest paths
        run: |
          set -euo pipefail
          cd AlphaSquadUI
          while IFS= read -r line; do
            case "$line" in
              ""|"##"*) continue ;;
            esac
            test -f "$line" || { echo "Missing manifest file: $line"; exit 1; }
          done < AlphaSquadUI.txt

      - name: Validate release metadata
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^## Version: //p' AlphaSquadUI/AlphaSquadUI.txt)"
          core_version="$(sed -n 's/^ASUI.version = "\([^"]*\)"/\1/p' AlphaSquadUI/Core/Core.lua)"
          addon_version="$(sed -n 's/^## AddOnVersion: //p' AlphaSquadUI/AlphaSquadUI.txt)"

          test -n "$manifest_version"
          test -n "$core_version"
          test -n "$addon_version"
          test "$manifest_version" = "$core_version" || {
            echo "Version mismatch: manifest=$manifest_version core=$core_version"
            exit 1
          }

          case "$addon_version" in
            *[!0-9]*|"") echo "AddOnVersion must be numeric"; exit 1 ;;
          esac

          grep -q '^## SavedVariables:' AlphaSquadUI/AlphaSquadUI.txt

      - name: Build addon ZIP
        run: |
          set -euo pipefail
          zip -r AlphaSquadUI.zip AlphaSquadUI -x '*/.gitkeep'
          unzip -t AlphaSquadUI.zip
          test "$(zipinfo -1 AlphaSquadUI.zip | head -n 1)" = "AlphaSquadUI/"

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSquadUI
          path: AlphaSquadUI.zip
          if-no-files-found: error
